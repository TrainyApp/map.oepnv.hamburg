<header class="topbar">
  <img src="logo.svg" alt="öpnv.hamburg" class="logo" />

  <span class="status" role="status" aria-live="polite">
    <span
      class="dot"
      [class.ok]="live.socketConnected() && live.mqttConnected()"
      [class.warn]="live.socketConnected() && !live.mqttConnected()"
    ></span>
    @if (!live.socketConnected()) {
      Verbinde …
    } @else if (!live.mqttConnected()) {
      Server ohne MQTT-Verbindung
    } @else {
      {{ live.vehicleCount() }} Fahrzeuge live
    }
  </span>

  <button
    type="button"
    class="filter-toggle"
    [attr.aria-expanded]="filtersOpen()"
    aria-controls="vehicle-filters"
    (click)="toggleFilters()"
  >
    Filter
    @if (live.hiddenTypes().size > 0) {
      <span class="filter-count">{{ live.hiddenTypes().size }}</span>
    }
  </button>

  <nav id="vehicle-filters" class="legend" [class.open]="filtersOpen()" aria-label="Fahrzeugtypen">
    @for (item of legend(); track item.type) {
      <button
        type="button"
        class="chip"
        [class.off]="item.hidden"
        [attr.aria-pressed]="!item.hidden"
        (click)="live.toggleType(item.type)"
      >
        <span class="swatch" [style.background]="item.color" aria-hidden="true"></span>
        {{ item.label }}
        <span class="count">{{ item.count }}</span>
      </button>
    }
  </nav>
</header>

<main class="map-area">
  <app-vehicle-map />
</main>
